<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民法｜重點整理筆記</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink:#1a1a1a; --sub:#6b7280; --line:#e5e7eb;
    --accent:#8B4438; --accent-bg:#f1e2dd;
    --accent2:#9C7A34; --accent2-bg:#efe6d0;
  }
  body {
    font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
    background: #f4f1eb;
    color: var(--ink);
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }
  .page-header {
    background: linear-gradient(135deg, #1a1a1a, #4a4a4a);
    color: white;
    border-radius: 16px;
    padding: 26px 32px;
    margin-bottom: 24px;
  }
  .page-header h1 { font-size: 26px; font-weight: 900; letter-spacing: 2px; }
  .page-header .subtitle { font-size: 14px; opacity: .8; margin-top: 8px; }
  .lesson-list { display: flex; flex-direction: column; gap: 14px; }
  .lesson-card {
    display: block;
    background: white;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 18px 22px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    transition: border-color .15s;
  }
  .lesson-card:hover { border-color: var(--ink); }
  .lesson-tag {
    display: inline-block;
    font-size: 12.5px;
    font-weight: 900;
    color: white;
    background: var(--ink);
    padding: 2px 10px;
    border-radius: 5px;
    margin-bottom: 8px;
  }
  .lesson-title { font-size: 18px; font-weight: 900; margin-bottom: 4px; }
  .lesson-desc { font-size: 13.5px; color: var(--sub); }
  .footer { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 32px; }
</style>
</head>
<body>

<div class="page-header">
  <h1>民法｜重點整理筆記</h1>
  <div class="subtitle">114年 不動產經紀人考試・考前複習用視覺化筆記</div>
</div>

<div class="lesson-list">
  <a class="lesson-card" href="./l1l2/">
    <div class="lesson-tag">L1 + L2</div>
    <div class="lesson-title">法律行為・意思表示・消滅時效與除斥期間</div>
    <div class="lesson-desc">法律行為 → 意思表示 → 瑕疵 → 撤銷 → 消滅時效 → 除斥期間 → 三大釋字</div>
  </a>
  <a class="lesson-card" href="./l3/">
    <div class="lesson-tag">L3</div>
    <div class="lesson-title">債編總則・債之發生</div>
    <div class="lesson-desc">契約成立 → 代理制度 → 無權處分 / 時效制度 / 權利行使 → 無因管理 → 不當得利 → 侵權行為</div>
  </a>
  <a class="lesson-card" href="./l4/">
    <div class="lesson-tag">L4</div>
    <div class="lesson-title">債之效力・保全・移轉與消滅</div>
    <div class="lesson-desc">契約解除終止 → 債務不履行三類型 → 債之保全 → 受領遲延 / 連帶之債 → 債之移轉與消滅</div>
  </a>
</div>

<div class="footer">民法筆記｜114年不動產經紀人考試</div>

</body>
</html>
